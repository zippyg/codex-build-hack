name: Rust control plane

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
      - run: uv sync --frozen
        working-directory: engine
      - run: uv run python scripts/generate_contract_bindings.py
        working-directory: engine
      - run: test -z "$(git status --porcelain=v1 --untracked-files=all -- engine/generated/contracts_v2 rust/crates/promptectomy-contracts)"
      - run: uv run pytest -q tests/test_contracts_v2.py
        working-directory: engine

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p promptectomy-core --test phase3_benchmark --release --locked -- --ignored --nocapture
