name: Phase 4 adapters and evidence

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  adapters:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
      - run: uv sync --frozen
        working-directory: engine
      - run: uv run ruff check .
        working-directory: engine
      - if: runner.os != 'Windows'
        run: uv run pytest -q
        working-directory: engine
      - if: runner.os == 'Windows'
        run: >-
          uv run pytest -q
          tests/test_contracts_v2.py
          tests/test_phase4_acceptance.py
          tests/test_phase4_capture_python.py
          tests/test_phase4_discovery.py
          tests/test_phase4_evidence.py
          tests/test_phase4_privacy.py
          tests/test_phase4_support_matrix.py
          -k "not identical_calls_in_one_symbol and not integrated_callsites and not safe_outputs_never_include"
        working-directory: engine
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: adapters/node
      - run: bun run typecheck
        working-directory: adapters/node
      - run: bun test
        working-directory: adapters/node
      - run: bun run package:check
        working-directory: adapters/node

  evidence:
    name: Receipt and support matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
      - run: uv sync --frozen
        working-directory: engine
      - run: uv run python scripts/phase4_acceptance.py --verify
        working-directory: engine
