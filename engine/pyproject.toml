[project]
name = "promptectomy"
version = "0.1.0"
description = "Local-first analysis, unverified patch drafts, and bounded offline OCI execution for supported LLM callsites."
requires-python = ">=3.12"
dependencies = [
    "apsw==3.53.3.1",
    "openai==2.46.0",
    "httpx>=0.28,<1",
    "pydantic>=2.9",
    "typer>=0.15",
    "deepdiff>=8.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jsonschema==4.26.0",
    "rfc8785==0.1.4",
    "cryptography==49.0.0",
    "opentelemetry-proto==1.44.0",
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff==0.15.22",
]

[project.scripts]
promptectomy = "promptectomy.cli:app"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["promptectomy/schema_assets/*.json", "promptectomy/executor_image/Dockerfile"]

[tool.hatch.build.targets.wheel]
packages = ["promptectomy"]
exclude = [
    "/promptectomy/contracts.py",
    "/promptectomy/events.py",
    "/promptectomy/generated/**",
    "/promptectomy/guard.py",
    "/promptectomy/ledger.py",
    "/promptectomy/pricing.py",
    "/promptectomy/replay.py",
    "/promptectomy/scan.py",
    "/promptectomy/schemas.py",
    "/promptectomy/scoring.py",
    "/promptectomy/server.py",
    "/promptectomy/shim.py",
    "/promptectomy/splitting.py",
    "/promptectomy/synthesize.py",
    "/promptectomy/verify.py",
    "/promptectomy/worktrees.py",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v2" = "promptectomy/schema_v2"
